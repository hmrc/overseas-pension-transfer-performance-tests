journeys {

    #PSA login tests

    MemberJourneyIsUkResident = {
        description = "Member is UK resident"
        load = 0.0021
        parts = [
            LoginAndNavigateToTaskList,
            MemberBasicDetails,
            MemberCurrentAddress,
            MemberIsUkResident
        ]
    }

    MemberJourneyIsNotUkResident = {
        description = "Member is not UK resident"
        load = 0.0021
        parts = [
            LoginAndNavigateToTaskList,
            MemberBasicDetails,
            MemberCurrentAddress,
            MemberIsNotUkResident
        ]
    }

  TransferDetailsQuotedShareJourney = {
         description = "Transfer details for quoted shares type"
         load = 0.0021
         parts = [
             LoginAndNavigateToTaskList,
             TransferQuotedShareSelection,
             TransferQuotedShareDetails
         ]
     }

     TransferDetailsUnquotedShareJourney = {
         description = "Transfer details for unquoted shares type"
         load = 0.0021
         parts = [
             LoginAndNavigateToTaskList,
             TransferUnquotedShareSelection,
             TransferUnquotedShareDetails
         ]
     }

     TransferDetailsPropertyJourney = {
         description = "Transfer details for property asset type"
         load = 0.0021
         parts = [
             LoginAndNavigateToTaskList,
             TransferPropertySelection,
             TransferPropertyDetails
         ]
     }

     TransferDetailsCashAndOtherAssetsJourney = {
         description = "Transfer details for cash and other assets type"
         load = 0.0021
         parts = [
             LoginAndNavigateToTaskList,
             TransferCashAndOtherAssetsSelection,
             TransferCashDetails,
             TransferOtherAssetsDetails
         ]
     }

     QROPSJourney = {
         description = "End to End QROPS Journey"
         load = 0.0021
         parts = [
             LoginAndNavigateToTaskList,
             QROPSBasicDetails,
             QROPSAddress,
             QROPSCountry
         ]
     }

     SchemeManagerAsIndividualJourney = {
         description = "Scheme Manager As Individual Journey"
         load = 0.0021
         parts = [
             LoginAndNavigateToTaskList,
             SchemeManagerIndividualDetails,
             SchemeManagerContactDetails
         ]
     }

     SchemeManagerAsOrganisationJourney = {
         description = "Scheme Manager As organisation Journey"
         load = 0.0021
         parts = [
             LoginAndNavigateToTaskList,
             SchemeManagerOrganisationDetails,
             SchemeManagerContactDetails
         ]
     }
 }

#Default behaviour is to run all journeys. If that is not what you need you can specify the list of journeys to run
journeysToRun = [
    MemberJourneyIsUkResident
    MemberJourneyIsNotUkResident
    TransferDetailsQuotedShareJourney
    TransferDetailsUnquotedShareJourney
    TransferDetailsPropertyJourney
    TransferDetailsCashAndOtherAssetsJourney
    QROPSJourney
    SchemeManagerAsIndividualJourney
    SchemeManagerAsOrganisationJourney
]

# You can specify the same list of journeys via environment variables:
# journeysToRun.0 = hello-world-1
# journeysToRun.1 = hello-world-3
